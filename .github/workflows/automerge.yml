name: Automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Drafts are skipped. Fork PRs are skipped too: this repository is public, and
    # auto-merging a fork PR would let an outside contributor land changes on main
    # by editing CI to pass trivially. Drop the second clause to include forks.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $state; nothing to do."
            exit 0
          fi

          enabled=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = "true" ]; then
            echo "Auto-merge already enabled on PR #$PR_NUMBER."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
          echo "Auto-merge enabled on PR #$PR_NUMBER (squash)."
