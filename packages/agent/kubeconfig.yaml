# The kubeconfig the agent image ships with.
#
# `kubectl` does not fall back to the mounted ServiceAccount on its own: with no
# kubeconfig it targets localhost:8080 and every `kubectl` in an Agent Job or a
# Grill-Me session fails. Point it at the in-cluster API instead.
#
# Nothing secret is stored here: the token is read from the projected volume on
# every request (`tokenFile`), so it follows the ServiceAccount's rotation, and
# the Pod's ServiceAccount decides what the caller may do (the Project's
# `yaaabk-agent` can read and exec, `yaaabk-deploy` may apply).
apiVersion: v1
kind: Config
clusters:
  - name: in-cluster
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
users:
  - name: in-cluster
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
contexts:
  - name: in-cluster
    context:
      cluster: in-cluster
      user: in-cluster
current-context: in-cluster
