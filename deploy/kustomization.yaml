apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  # The shared AppProject is cluster-scoped and applied separately (it cannot
  # go through this namespace-forcing kustomization): see appproject.yaml.
  - pvc.yaml
  - backend.yaml
  - frontend.yaml
  - httproute.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: yaaabk
