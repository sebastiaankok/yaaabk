# Namespace-scoped access for the backend, nothing more.
#
# It provisions agent Jobs, PVCs and per-attempt Secrets in `yaaabk`, and
# ArgoCD Applications in `yaaabk-apps`. No ClusterRoleBindings exist: the
# backend can neither read other namespaces' Secrets nor escalate itself, and
# everything cluster-scoped (namespaces, AppProjects) is managed by ArgoCD
# from Git instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yaaabk-backend
  namespace: yaaabk
---
# Agent execution: Jobs, their working PVCs and the per-attempt GitHub /
# OpenRouter token Secrets. `secrets` appears twice (create/delete and the
# get/list/watch the Secret informers need) because a single rule cannot mix
# those verb sets without over-granting.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yaaabk-backend-agent
  namespace: yaaabk
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yaaabk-backend-agent
  namespace: yaaabk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yaaabk-backend-agent
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# ArgoCD Applications: every Project Application lives here and defers to the
# shared, GitOps-managed AppProject. AppProjects themselves are cluster-scoped
# and deliberately absent — YAAABK never creates or modifies one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yaaabk-backend-argocd
  namespace: yaaabk-apps
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [create, get, list, watch, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yaaabk-backend-argocd
  namespace: yaaabk-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yaaabk-backend-argocd
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
