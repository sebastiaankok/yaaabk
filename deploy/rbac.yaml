# Namespace-scoped access for the backend in `yaaabk`, plus narrow cluster-scoped
# Roles for provisioning Project Namespaces and their per-Project RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yaaabk-backend
  namespace: yaaabk
---
# Cluster-scoped Namespace lifecycle management: the backend creates, reads and
# deletes each Project's `yaaabk-<short-uuid>` Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-backend-namespaces
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaaabk-backend-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaaabk-backend-namespaces
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# Cluster-scoped RBAC provisioning: the backend manages ServiceAccounts, Roles,
# and RoleBindings inside Project Namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-backend-rbac
rules:
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, get, list, watch, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaaabk-backend-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaaabk-backend-rbac
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# Agent execution: Jobs, their working PVCs and the per-attempt GitHub /
# OpenRouter token Secrets. `secrets` appears twice (create/delete and the
# get/list/watch the Secret informers need) because a single rule cannot mix
# those verb sets without over-granting.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yaaabk-backend-agent
  namespace: yaaabk
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yaaabk-backend-agent
  namespace: yaaabk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yaaabk-backend-agent
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# ArgoCD Applications: every Project Application lives in `yaaabk`, beside the
# backend, and defers to the shared, GitOps-managed AppProject. AppProjects
# themselves are cluster-scoped and deliberately absent — YAAABK never creates
# or modifies one. Kept separate from the agent Role above so the two concerns
# stay independently reviewable, even though both are namespaced to `yaaabk`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yaaabk-backend-argocd
  namespace: yaaabk
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [create, get, list, watch, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yaaabk-backend-argocd
  namespace: yaaabk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yaaabk-backend-argocd
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
