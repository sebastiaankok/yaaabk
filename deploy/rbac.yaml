# Namespace-scoped access for the backend in `yaaabk`, plus narrow cluster-scoped
# Roles for provisioning Project Namespaces and their per-Project RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yaaabk-backend
  namespace: yaaabk
---
# Cluster-scoped Namespace lifecycle management: the backend creates, reads and
# deletes each Project's `yaaabk-<short-uuid>` Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-backend-namespaces
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaaabk-backend-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaaabk-backend-namespaces
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# Per-Project permission sets, defined here rather than minted per Project.
# Kubernetes forbids creating a Role that grants permissions the creator does not
# hold, so the backend binds these fixed ClusterRoles into each Project Namespace
# with a RoleBinding instead. That keeps the grant auditable in git and stops the
# backend from inventing new permissions.
#
# `yaaabk-agent`: read-only (get/list/watch) on core resources, deployments, and
# httproutes, plus create on pods/exec. Never grants secrets read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-project-agent
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, configmaps, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
---
# `yaaabk-deploy`: full write on deployments, services, configmaps, secrets, and
# httproutes, plus read on pods/pods/log. Cannot create or delete Namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-project-deploy
rules:
  - apiGroups: ['']
    resources: [services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
---
# Cluster-scoped RBAC provisioning: the backend manages ServiceAccounts and
# RoleBindings inside Project Namespaces. It may `bind` only the two fixed
# per-Project ClusterRoles above (`bind` is the RBAC verb for creating a binding
# to a role the caller does not itself hold); it cannot create or escalate Roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-backend-rbac
rules:
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [yaaabk-project-agent, yaaabk-project-deploy]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaaabk-backend-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaaabk-backend-rbac
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# Agent & deploy execution: the backend manages Jobs, PVCs (for agent runs) and
# the per-run GitHub / OpenRouter token Secrets across arbitrary Project
# Namespaces (`yaaabk-<short-uuid>`). Deploy Jobs run with an ephemeral
# emptyDir volume under the Project's `yaaabk-deploy` ServiceAccount.
# `secrets` appears twice (create/delete and the get/list/watch the Secret
# informers need) because a single rule cannot mix those verb sets without
# over-granting.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-backend-agent
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaaabk-backend-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaaabk-backend-agent
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# Session runtimes: the backend creates one hardened Pod and NetworkPolicy per
# Grill-Me Session inside a Project Namespace. Session Secrets are covered by
# `yaaabk-backend-agent`; this role adds nothing beyond the runtime resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaaabk-backend-sessions
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaaabk-backend-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaaabk-backend-sessions
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
