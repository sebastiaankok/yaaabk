# Namespace-scoped access for the backend, nothing more.
#
# Everything the backend does happens in `yaaabk`: it provisions agent Jobs,
# PVCs and per-attempt Secrets there, and it creates each Project's ArgoCD
# Application there too. No ClusterRoleBindings exist: the backend can neither
# read other namespaces' Secrets nor escalate itself, and everything
# cluster-scoped (namespaces, AppProjects) is managed by ArgoCD from Git
# instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yaaabk-backend
  namespace: yaaabk
---
# Agent execution: Jobs, their working PVCs and the per-attempt GitHub /
# OpenRouter token Secrets. `secrets` appears twice (create/delete and the
# get/list/watch the Secret informers need) because a single rule cannot mix
# those verb sets without over-granting.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yaaabk-backend-agent
  namespace: yaaabk
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yaaabk-backend-agent
  namespace: yaaabk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yaaabk-backend-agent
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
---
# ArgoCD Applications: every Project Application lives in `yaaabk`, beside the
# backend, and defers to the shared, GitOps-managed AppProject. AppProjects
# themselves are cluster-scoped and deliberately absent — YAAABK never creates
# or modifies one. Kept separate from the agent Role above so the two concerns
# stay independently reviewable, even though both are namespaced to `yaaabk`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yaaabk-backend-argocd
  namespace: yaaabk
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [create, get, list, watch, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yaaabk-backend-argocd
  namespace: yaaabk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yaaabk-backend-argocd
subjects:
  - kind: ServiceAccount
    name: yaaabk-backend
    namespace: yaaabk
