# The browser reads the API base from the SSR'd payload, which the adapter-bun
# server resolves from process.env at startup (src/env.ts holds the dev
# fallback). Deploy the real URL here; the same-origin HTTPRoute sends /api to
# the backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaaabk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yaaabk-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yaaabk-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sebastiaankok/yaaabk-frontend:0.1.0
          # Tag is mutable (retagged on rebuild); always re-check the registry.
          imagePullPolicy: Always
          env:
            - name: PUBLIC_API_BASE_URL
              value: https://yaaabk.otohgunga.nl
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            # adapter-bun serves no health endpoint; a socket probe is enough.
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: yaaabk-frontend
spec:
  selector:
    app.kubernetes.io/name: yaaabk-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
