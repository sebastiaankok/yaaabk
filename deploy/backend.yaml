# SQLite on a RWO volume means exactly one replica and no rolling updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaaabk-backend
  namespace: yaaabk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yaaabk-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yaaabk-backend
    spec:
      # With Recreate the old pod must exit before the new one starts, so this
      # caps how long a stuck shutdown delays a rollout. The backend drains
      # in-flight requests for YAAABK_SHUTDOWN_DRAIN_MS (5s) and then exits, so
      # 10 is only reached when the process itself is wedged.
      terminationGracePeriodSeconds: 10
      # The yaaabk namespace enforces Pod Security "restricted".
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: yaaabk-backend
      containers:
        - name: backend
          image: ghcr.io/sebastiaankok/yaaabk-backend:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          # Tag is mutable (retagged on rebuild); always re-check the registry.
          imagePullPolicy: Always
          envFrom:
            # Out-of-band Secret holding YAAABK_AUTH_SECRET and the optional
            # credential fallbacks (YAAABK_GITHUB_TOKEN, OPENROUTER_MANAGEMENT_KEY,
            # ...). Created separately so values never enter git.
            - secretRef:
                name: yaaabk-env
                optional: true
          env:
            - name: PORT
              value: '3000'
            - name: YAAABK_DATA_DIR
              value: /data
            - name: YAAABK_WEB_ORIGIN
              value: https://yaaabk.otohgunga.nl
            # Agent Jobs report back over the cluster-internal Service; browsers
            # reach the API through the HTTPRoute instead. Use the Service's
            # port (80), not the container port: a ClusterIP only forwards the
            # ports its Service declares, so `:3000` hangs instead of refusing.
            - name: YAAABK_API_URL
              value: http://yaaabk-backend.yaaabk.svc.cluster.local
            - name: YAAABK_AGENT_IMAGE
              value: ghcr.io/sebastiaankok/yaaabk-agent:0.1.0
            # Working PVCs must name a StorageClass when the cluster has no
            # default one; k3s provides `local-path` but does not mark it
            # default. Change this to match the cluster's StorageClass.
            - name: YAAABK_AGENT_STORAGE_CLASS
              value: local-path
            # Grill-Me Sessions run as per-session Pods in the Project Namespace,
            # using the same pinned OpenCode runtime as Agent Jobs. The backend
            # proxy reaches them through the cluster network; the reporting MCP
            # server posts drafts back over the internal Service.
            - name: YAAABK_SESSION_RUNTIME
              value: kubernetes
            - name: YAAABK_SESSION_IMAGE
              value: ghcr.io/sebastiaankok/yaaabk-agent:0.1.0
            # Same Service URL for a session's reporting MCP server; see
            # YAAABK_API_URL above for why the port is 80, not 3000.
            - name: YAAABK_SESSION_API_URL
              value: http://yaaabk-backend.yaaabk.svc.cluster.local
            - name: YAAABK_NAMESPACE
              value: yaaabk
            # The scaffold template bundled into the image (see backend
            # Dockerfile). Must name the template directory itself, not the
            # directory holding it: the scaffolder copies this directory's
            # contents to the repository root.
            - name: YAAABK_TEMPLATE_DIR
              value: /app/templates/svelte-bun
            # Trust the in-cluster API server's CA in Node's TLS stack: Bun's
            # undici ignores the CA @kubernetes/client-node loads, so every
            # in-cluster call fails with "self signed certificate in
            # certificate chain" without this (see ensureInClusterCaTrusted,
            # which is a no-op when this is already set).
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yaaabk-data
---
apiVersion: v1
kind: Service
metadata:
  name: yaaabk-backend
  namespace: yaaabk
spec:
  selector:
    app.kubernetes.io/name: yaaabk-backend
  ports:
    - name: http
      port: 80
      targetPort: http
