apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{projectName}}
  namespace: {{namespace}}
  labels:
    app.kubernetes.io/name: {{projectName}}
    yaaabk.io/project-id: '{{projectId}}'
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
  hostnames:
    - {{projectName}}.otohgunga.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{projectName}}
          port: 80